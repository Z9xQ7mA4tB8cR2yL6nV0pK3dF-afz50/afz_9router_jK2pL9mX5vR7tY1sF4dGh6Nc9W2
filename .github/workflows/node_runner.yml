name: "9Router Dedicated Node Runner"

on:
  workflow_dispatch:
    inputs:
      nodes:
        description: "Target Nodes"
        required: true
        type: string
      force:
        description: "Force Takeover (Bypass Lock)"
        required: false
        type: boolean
        default: false

jobs:
  resolve-nodes:
    name: "Resolve Target Nodes"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: "Compute Matrix from Nodes Input"
        id: resolve
        run: |
          INPUT="${{ github.event.inputs.nodes }}"
          echo "[INFO] Target nodes input: $INPUT"
          
          # Parse comma-separated nodes into JSON array
          NODES_JSON=$(node -e "
            const raw = process.argv[1] || '';
            const arr = raw.split(',').map(s => s.trim()).filter(Boolean);
            if (!arr.length) {
              console.error('[ERROR] No nodes provided!');
              process.exit(1);
            }
            console.log(JSON.stringify(arr));
          " "$INPUT")
          
          echo "matrix=$NODES_JSON" >> $GITHUB_OUTPUT
          echo "=================================================="
          echo "  RESOLVED TARGET NODES: $NODES_JSON"
          echo "=================================================="

  run-node:
    name: "Node: ${{ matrix.node_id }}"
    needs: resolve-nodes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_id: ${{ fromJson(needs.resolve-nodes.outputs.matrix) }}

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4

      - name: "2. Set Up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "3. Pre-Flight Lock Check (Fast Abort)"
        id: lock_check
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
            echo "[INFO] Force override enabled! Bypassing lock check."
          fi
          
          echo "[STEP 3] Pre-flight checking lock for slot ${{ matrix.node_id }}..."
          if python3 scripts/monitor.py check-lock --slot "${{ matrix.node_id }}" $FORCE_FLAG; then
            echo "locked=false" >> $GITHUB_OUTPUT
          else
            echo "locked=true" >> $GITHUB_OUTPUT
            echo "=================================================="
            echo "  [ABORT] Active lock detected for ${{ matrix.node_id }}."
            echo "  Duplicate run terminated cleanly without changes."
            echo "=================================================="
          fi

      - name: "4. Set Up Node.js and System Tools"
        if: steps.lock_check.outputs.locked != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "5. Resolve Dynamic Port (Formula: 6000 + N) and Identity"
        if: steps.lock_check.outputs.locked != 'true'
        id: node_meta
        run: |
          NODE="${{ matrix.node_id }}"
          
          # Extract trailing digits (e.g. 9rt2 -> 2, node-3 -> 3, 9rt320 -> 320)
          NUM=$(echo "$NODE" | grep -o -E '[0-9]+' | tail -n 1)
          
          if [ -n "$NUM" ]; then
            PORT=$((6000 + NUM))
          else
            PORT=20128
          fi
          
          # Validate TCP port limit
          if [ "$PORT" -gt 65535 ]; then
            echo "[ERROR] Calculated port $PORT exceeds maximum allowed TCP port 65535!"
            exit 1
          fi
          
          echo "port=$PORT" >> $GITHUB_OUTPUT
          
          # Standard API key for 9router
          API_KEY="sk-361ddf48ad95487f-l1vj9z-499b11a6"
          echo "api_key=$API_KEY" >> $GITHUB_OUTPUT
          
          echo "=================================================="
          echo "  NODE IDENTITY : $NODE"
          echo "  DYNAMIC PORT  : $PORT (Formula: 6000 + $NUM)"
          echo "=================================================="

      - name: "6. Install 9Router CLI"
        if: steps.lock_check.outputs.locked != 'true'
        run: |
          echo "[STEP 6] Installing 9Router globally via npm..."
          npm install -g 9router
          echo "[INFO] 9Router root: $(npm root -g)/9router"

      - name: "7. Headlessly Pre-Seed Database (OpenCode Models and API Key)"
        if: steps.lock_check.outputs.locked != 'true'
        env:
          ROUTER_API_KEY: ${{ steps.node_meta.outputs.api_key }}
        run: |
          echo "[STEP 7] Running SQLite Seeder..."
          python3 scripts/seed_db.py
          
          DB_PATH="$HOME/.9router/db/data.sqlite"
          if [ -f "$DB_PATH" ]; then
            echo "[SUCCESS] Database initialized at $DB_PATH"
            ls -lh "$DB_PATH"
          else
            echo "[ERROR] Database file not found!"
            exit 1
          fi

      - name: "8. Launch 9Router Engine (Headless Daemon Mode)"
        if: steps.lock_check.outputs.locked != 'true'
        id: start_engine
        env:
          PORT: ${{ steps.node_meta.outputs.port }}
        run: |
          echo "[STEP 8] Launching 9Router server on dynamic port $PORT..."
          
          ROUTER_APP_DIR="$(npm root -g)/9router/app"
          if [ -f "$ROUTER_APP_DIR/server.js" ]; then
            echo "[INFO] Starting standalone server from $ROUTER_APP_DIR/server.js..."
            PORT="$PORT" HOSTNAME="0.0.0.0" node "$ROUTER_APP_DIR/server.js" &
          else
            echo "[INFO] Starting via 9router CLI in tray/background mode..."
            9router -p "$PORT" -H 0.0.0.0 --tray -n &
          fi
          
          echo "[INFO] Waiting for port $PORT to become active..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 "$PORT" 2>/dev/null || curl -s "http://127.0.0.1:$PORT" >/dev/null 2>&1; then
              echo "[SUCCESS] 9Router is listening on port $PORT! (Attempt $i)"
              break
            fi
            sleep 1
          done

      - name: "9. Verify Local 9Router Engine and Models"
        if: steps.lock_check.outputs.locked != 'true'
        env:
          PORT: ${{ steps.node_meta.outputs.port }}
          API_KEY: ${{ steps.node_meta.outputs.api_key }}
        run: |
          echo "[STEP 9] Verifying 9Router models endpoint with Bearer Token..."
          sleep 2
          RESPONSE=$(curl -s -H "Authorization: Bearer $API_KEY" "http://127.0.0.1:$PORT/v1/models" || echo "FAILED")
          echo "------------------- [MODELS API RESPONSE] -------------------"
          echo "$RESPONSE" | jq . || echo "$RESPONSE"
          echo "-------------------------------------------------------------"
          
          if echo "$RESPONSE" | grep -q "mimo-v2.5-free"; then
            echo "[VERIFIED] OpenCode Free models loaded and ready!"
          else
            echo "[INFO] Response received from models endpoint."
          fi

      - name: "10. Install and Connect Cloudflare Tunnel"
        if: steps.lock_check.outputs.locked != 'true'
        env:
          NODE: ${{ matrix.node_id }}
          CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          echo "[STEP 10] Setting up Cloudflare Tunnel for $NODE..."
          
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-public-v2.gpg | sudo tee /usr/share/keyrings/cloudflare-public-v2.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-public-v2.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflared
          
          if [ -z "$CF_TOKEN" ]; then
            echo "[WARN] Secret CF_TUNNEL_TOKEN is not set in repository secrets!"
            echo "[INFO] Running in mock/dry-run mode for tunnel."
          else
            echo "[INFO] Starting cloudflared tunnel service..."
            cloudflared tunnel --no-autoupdate run --token "$CF_TOKEN" &
            echo "[SUCCESS] Cloudflare tunnel started in background."
          fi

      - name: "11. Launch Telemetry & Lock Lease Monitor (2-Key Redis)"
        if: steps.lock_check.outputs.locked != 'true'
        env:
          NODE: ${{ matrix.node_id }}
          PORT: ${{ steps.node_meta.outputs.port }}
          API_KEY: ${{ steps.node_meta.outputs.api_key }}
        run: |
          echo "[STEP 11] Running 2-Key Telemetry & Lease Daemon for $NODE..."
          python3 scripts/monitor.py run \
            --slot "$NODE" \
            --port "$PORT" \
            --gh-run-id "${{ github.run_id }}" \
            --api-key "$API_KEY"

      - name: "12. Clean Up on Exit"
        if: always() && steps.lock_check.outputs.locked != 'true'
        run: |
          echo "[CLEANUP] Runner completed or terminated."
