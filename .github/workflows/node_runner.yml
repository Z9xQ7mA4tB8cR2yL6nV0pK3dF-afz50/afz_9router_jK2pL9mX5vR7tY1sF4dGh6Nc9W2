name: "9Router Dedicated Node Runner"

on:
  workflow_dispatch:
    inputs:
      nodes:
        description: "Target Nodes (e.g. node-1, node-2)"
        required: true
        type: string
      node_name:
        description: "Poetic Node Name (e.g. Sobuj Kanon)"
        required: false
        type: string
        default: ""
      force:
        description: "Force Takeover (Bypass Lock)"
        required: false
        type: boolean
        default: false

jobs:
  resolve-nodes:
    name: "Resolve Target Nodes"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: "Compute Matrix from Nodes Input"
        id: resolve
        run: |
          INPUT="${{ github.event.inputs.nodes }}"
          echo "[INFO] Target nodes input: $INPUT"
          
          # Parse comma-separated nodes into JSON array
          NODES_JSON=$(node -e "
            const raw = process.argv[1] || '';
            const arr = raw.split(',').map(s => s.trim()).filter(Boolean);
            if (!arr.length) {
              console.error('[ERROR] No nodes provided!');
              process.exit(1);
            }
            console.log(JSON.stringify(arr));
          " "$INPUT")
          
          echo "matrix=$NODES_JSON" >> $GITHUB_OUTPUT
          echo "=================================================="
          echo "  RESOLVED TARGET NODES: $NODES_JSON"
          echo "=================================================="

  run-node:
    name: "Node: ${{ matrix.node_id }}"
    needs: resolve-nodes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_id: ${{ fromJson(needs.resolve-nodes.outputs.matrix) }}

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4

      - name: "2. Set Up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "3. Set Up Node.js and System Tools"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "4. Resolve Dynamic Port (Formula: 6000 + N) and Identity"
        id: node_meta
        run: |
          NODE="${{ matrix.node_id }}"
          
          # Extract trailing digits (e.g. node-3 -> 3, 9rt2 -> 2, 3 -> 3)
          NUM=$(echo "$NODE" | grep -o -E '[0-9]+' | tail -n 1)
          
          if [ -n "$NUM" ]; then
            PORT=$((6000 + NUM))
            CANONICAL_SLOT="node-$NUM"
          else
            PORT=20128
            CANONICAL_SLOT="$NODE"
          fi
          
          # Validate TCP port limit
          if [ "$PORT" -gt 65535 ]; then
            echo "[ERROR] Calculated port $PORT exceeds maximum allowed TCP port 65535!"
            exit 1
          fi
          
          BOOT_TIME=$(date +%s)
          RUN_ID="${CANONICAL_SLOT}_${BOOT_TIME}"
          
          NODE_NAME="${{ github.event.inputs.node_name }}"
          if [ -z "$NODE_NAME" ]; then
            NODE_NAME="$CANONICAL_SLOT"
          fi
          
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "canonical_slot=$CANONICAL_SLOT" >> $GITHUB_OUTPUT
          echo "node_name=$NODE_NAME" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: "5. Fetch Runner Config from Worker (Single Source of Truth)"
        id: fetch_config
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_HANDSHAKE_TOKEN: ${{ secrets.WORKER_HANDSHAKE_TOKEN }}
          SLOT: ${{ steps.node_meta.outputs.canonical_slot }}
        run: |
          echo "[STEP 5] Fetching runner config from Worker..."
          RESPONSE=$(curl -s -X GET \
            -H "x-handshake-token: $WORKER_HANDSHAKE_TOKEN" \
            "$WORKER_URL/api/node/$SLOT/config")
          
          echo "Worker Response: $RESPONSE"
          
          REDIS_BASE=$(echo "$RESPONSE" | jq -r '.config.redis_base // empty')
          ADMIN_SECRET=$(echo "$RESPONSE" | jq -r '.config.admin_secret // empty')
          WORKER_URL_RECEIVED=$(echo "$RESPONSE" | jq -r '.config.worker_url // empty')
          HANDSHAKE_TOKEN_RECEIVED=$(echo "$RESPONSE" | jq -r '.config.handshake_token // empty')
          NODE_NAME_FROM_CONFIG=$(echo "$RESPONSE" | jq -r '.name // empty')
          
          if [ -z "$REDIS_BASE" ] || [ "$REDIS_BASE" = "null" ]; then
            echo "[ERROR] REDIS_BASE not returned by Worker"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          
          # Use name from NODE_CONFIG if available, else fallback to node_name
          FINAL_NODE_NAME="${NODE_NAME_FROM_CONFIG:-${{ steps.node_meta.outputs.node_name }}}"
          
          echo "redis_base=$REDIS_BASE" >> $GITHUB_OUTPUT
          echo "admin_secret=$ADMIN_SECRET" >> $GITHUB_OUTPUT
          echo "worker_url=$WORKER_URL_RECEIVED" >> $GITHUB_OUTPUT
          echo "handshake_token=$HANDSHAKE_TOKEN_RECEIVED" >> $GITHUB_OUTPUT
          echo "node_name=$FINAL_NODE_NAME" >> $GITHUB_OUTPUT
          
          echo "[SUCCESS] Config fetched from Worker:"
          echo "  - Redis Base: $REDIS_BASE"
          echo "  - Worker URL: $WORKER_URL_RECEIVED"
          echo "  - Node Name: $FINAL_NODE_NAME"

      - name: "6. Pre-Flight Lock Check (Fast Abort) - Using Worker's Redis"
        id: lock_check
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
            echo "[INFO] Force override enabled! Bypassing lock check."
          fi
          
          echo "[STEP 6] Pre-flight checking lock for slot ${{ steps.node_meta.outputs.canonical_slot }} using Worker's Redis..."
          if python3 scripts/monitor.py check-lock --slot "${{ steps.node_meta.outputs.canonical_slot }}" --redis-base "${{ steps.fetch_config.outputs.redis_base }}" $FORCE_FLAG; then
            echo "locked=false" >> $GITHUB_OUTPUT
          else
            echo "locked=true" >> $GITHUB_OUTPUT
            echo "=================================================="
            echo "  [ABORT] Active lock detected for ${{ steps.node_meta.outputs.canonical_slot }}."
            echo "  Duplicate run terminated cleanly without changes."
            echo "=================================================="
          fi

      - name: "8. Install 9Router CLI"
        if: steps.lock_check.outputs.locked != 'true'
        run: |
          echo "[STEP 8] Installing 9Router globally via npm..."
          npm install -g 9router
          echo "[INFO] 9Router root: $(npm root -g)/9router"

      - name: "8. Headlessly Pre-Seed Database (OpenCode Models)"
        if: steps.lock_check.outputs.locked != 'true'
        id: seed
        env:
          PORT: ${{ steps.node_meta.outputs.port }}
          REDIS_BASE: ${{ steps.fetch_config.outputs.redis_base }}
          INITIAL_PASSWORD: "affaz.${{ steps.node_meta.outputs.port }}"
        run: |
          echo "[STEP 8] Running SQLite Seeder..."
          python3 scripts/seed_db.py
          
          DB_PATH="$HOME/.9router/db/data.sqlite"
          KEY_FILE="$HOME/.9router/db/api_key.txt"
          if [ -f "$DB_PATH" ]; then
            echo "[SUCCESS] Database initialized at $DB_PATH"
            ls -lh "$DB_PATH"
          else
            echo "[ERROR] Database file not found!"
            exit 1
          fi
          
          if [ -f "$KEY_FILE" ]; then
            API_KEY=$(cat "$KEY_FILE")
            echo "api_key=$API_KEY" >> $GITHUB_OUTPUT
            echo "[SUCCESS] API key captured: ${API_KEY:0:12}..."
          else
            echo "[ERROR] API key file not found!"
            exit 1
          fi

      - name: "7.5. Setup Cloudflare WARP (Local SOCKS5 Proxy Mode on 127.0.0.1:40000)"
        if: steps.lock_check.outputs.locked != 'true'
        run: |
          echo "[STEP 7.5] Installing Cloudflare WARP client..."
          
          # Method 1: Try direct .deb from Cloudflare package index
          echo "[INFO] Fetching latest WARP .deb from Cloudflare package index..."
          DEB_URL=$(curl -fsSL --max-time 30 "https://pkg.cloudflareclient.com/dists/$(lsb_release -cs)/main/binary-amd64/Packages" 2>/dev/null | grep -A5 "Package: cloudflare-warp" | grep "Filename:" | head -1 | sed 's/Filename: //' | sed 's|^|https://pkg.cloudflareclient.com/|')
          
          if [ -n "$DEB_URL" ]; then
            echo "[INFO] Downloading WARP from $DEB_URL"
            curl -fsSL --max-time 60 "$DEB_URL" -o /tmp/cloudflare-warp.deb
            sudo dpkg -i /tmp/cloudflare-warp.deb || sudo apt-get install -f -y -qq
            echo "[SUCCESS] WARP installed via direct .deb"
          else
            echo "[WARN] Could not fetch .deb URL, trying apt with retries..."
            
            # Method 2: apt with retries and longer timeouts
            sudo mkdir -p --mode=0755 /usr/share/keyrings
            curl -fsSL --max-time 30 https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            
            # Retry apt update
            for i in {1..3}; do
              echo "[INFO] apt-get update attempt $i/3..."
              if timeout 90 sudo apt-get update -qq; then
                break
              fi
              sleep 10
            done
            
            # Retry apt install
            for i in {1..3}; do
              echo "[INFO] apt-get install attempt $i/3..."
              if timeout 180 sudo apt-get install -y -qq -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" cloudflare-warp; then
                break
              fi
              sleep 10
            done
            
            if ! command -v warp-cli &> /dev/null; then
              echo "[ERROR] WARP install failed after all retries"
              exit 1
            fi
            
            echo "[SUCCESS] WARP installed via apt"
          fi
          
          echo "[INFO] Ensuring warp-svc daemon is active..."
          sudo systemctl start warp-svc 2>/dev/null || sudo service warp-svc start 2>/dev/null || true
          sleep 2
          
          echo "[INFO] Registering WARP client..."
          warp-cli --accept-tos registration new 2>/dev/null || warp-cli --accept-tos register 2>/dev/null || true
          
          echo "[INFO] Configuring WARP in SOCKS5 Proxy mode (preventing routing conflicts with cloudflared)..."
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000 2>/dev/null || true
          
          echo "[INFO] Connecting to Cloudflare WARP edge..."
          timeout 60 warp-cli --accept-tos connect || echo "[WARN] WARP connect timed out, continuing..."
          
          # Short wait for tunnel establishment
          for i in {1..10}; do
            STATUS=$(warp-cli --accept-tos status 2>/dev/null || echo "")
            if echo "$STATUS" | grep -qi "Connected"; then
              echo "[SUCCESS] Cloudflare WARP is connected in proxy mode! (Attempt $i)"
              break
            fi
            sleep 1
          done
          
          echo "[INFO] Testing WARP SOCKS5 egress IP..."
          curl -s --socks5 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|warp=' || echo "[WARN] Trace check skipped."
          
          # Verify SOCKS5 proxy actually works for HTTP requests
          echo "[INFO] Verifying SOCKS5 proxy for HTTP requests..."
          for i in {1..5}; do
            PROXY_TEST=$(curl -s --max-time 10 --socks5 127.0.0.1:40000 https://httpbin.org/ip 2>/dev/null || echo "FAILED")
            if echo "$PROXY_TEST" | grep -q '"origin"'; then
              PROXY_IP=$(echo "$PROXY_TEST" | grep -o '"origin": "[^"]*"' | cut -d'"' -f4)
              echo "[SUCCESS] SOCKS5 proxy working! Egress IP via WARP: $PROXY_IP"
              break
            fi
            echo "[RETRY $i/5] SOCKS5 proxy not ready, waiting..."
            sleep 3
          done
          
          if ! echo "$PROXY_TEST" | grep -q '"origin"'; then
            echo "[ERROR] SOCKS5 proxy verification FAILED after 5 attempts!"
            echo "[ERROR] WARP proxy on port 40000 is not functional. Check warp-svc status."
            warp-cli --accept-tos status
            exit 1
          fi

      - name: "7.6. Install OpenCode CLI"
        if: steps.lock_check.outputs.locked != 'true'
        run: |
          echo "[STEP 7.6] Installing OpenCode CLI..."
          curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          echo 'export PATH="$HOME/.opencode/bin:$PATH"' >> $HOME/.bashrc
          opencode --version
          echo "[SUCCESS] OpenCode CLI installed successfully"

      - name: "7.7. Setup OpenCode Proxy Stack (setup.sh)"
        if: steps.lock_check.outputs.locked != 'true'
        env:
          PORT: ${{ steps.node_meta.outputs.port }}
          SLOT: ${{ steps.node_meta.outputs.canonical_slot }}
        run: |
          echo "[STEP 7.7] Running setup.sh to install OpenCode Proxy Stack..."
          SLOT="${{ steps.node_meta.outputs.canonical_slot }}"
          SLOT_NUM=$(echo "$SLOT" | grep -o -E '[0-9]+' | tail -n 1)
          PRIMARY_PORT=$((7005 + SLOT_NUM * 10))
          TEST_PORT=$((4097))
          SERVE_PORT=4096
          
          echo "[INFO] Running setup.sh with ports: serve=4096, primary=$PRIMARY_PORT, test=4097..."
          sudo bash scripts/setup.sh \
            --primary-port $PRIMARY_PORT \
            --test-port 4097 \
            --serve-port 4096 \
            --proxy-key affaz \
            --model opencode/deepseek-v4.1-flash-free
            
      - name: "7.7. Setup Cloudflare Tunnel SSH Access + Register to Worker"
        if: steps.lock_check.outputs.locked != 'true'
        id: ssh_tunnel
        env:
          SLOT: ${{ steps.node_meta.outputs.canonical_slot }}
          NODE_NAME: ${{ steps.node_meta.outputs.node_name }}
          SSH_WORKER_URL: https://affaz-ssh.cmt202150.workers.dev
          NODE_SECRET: ${{ secrets.NODE_SECRET }}
        run: |
          echo "[STEP 7.7] Setting up SSH access via Cloudflare Tunnel + registering to Worker..."
          
          # Install cloudflared if not present
          if ! command -v cloudflared &> /dev/null; then
            echo "[INFO] Installing cloudflared..."
            sudo mkdir -p --mode=0755 /usr/share/keyrings
            curl -fsSL https://pkg.cloudflare.com/cloudflare-public-v2.gpg | sudo tee /usr/share/keyrings/cloudflare-public-v2.gpg >/dev/null
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-public-v2.gpg] https://pkg.cloudflare.com/cloudflared any main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
            sudo apt-get update -qq && sudo apt-get install -y -qq cloudflared
          fi
          
          # Install and start SSH server
          echo "[INFO] Installing SSH server..."
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
          sudo mkdir -p /var/run/sshd
          sudo sed -i 's/#Port 22/Port 22/' /etc/ssh/sshd_config
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          
          # Set root password to "affaz" (standardized)
          echo "root:affaz" | sudo chpasswd
          echo "[INFO] Root password set to: [REDACTED]"
          
          # Generate host keys if missing
          sudo ssh-keygen -A
          
          # Start SSH daemon
          sudo /usr/sbin/sshd -D &
          sleep 2
          
          # Verify SSH is running
          if ss -tlnp | grep -q ":22 "; then
            echo "[SUCCESS] SSH server running on port 22"
          else
            echo "[ERROR] SSH server failed to start"
            exit 1
          fi
          
          # Start cloudflared quick tunnel for SSH (no Zero Trust required)
          echo "[INFO] Starting Cloudflare quick tunnel for SSH..."
          TUNNEL_OUTPUT=$(mktemp)
          # cloudflared tunnel --url ssh://localhost:22 creates a quick trycloudflare.com tunnel
          cloudflared tunnel --url ssh://localhost:22 --no-autoupdate > "$TUNNEL_OUTPUT" 2>&1 &
          TUNNEL_PID=$!
          
          # Wait for tunnel to be ready and extract URL with retry for 429 rate limit
          echo "[INFO] Waiting for tunnel to establish..."
          TUNNEL_URL=""
          for attempt in {1..5}; do
            echo "[INFO] Attempt $attempt/5 to get tunnel URL..."
            for i in {1..30}; do
              if [ -f "$TUNNEL_OUTPUT" ]; then
                # Quick tunnel URL format: https://<random>.trycloudflare.com
                TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' "$TUNNEL_OUTPUT" | head -1)
                if [ -n "$TUNNEL_URL" ]; then
                  break 2
                fi
                # Check for 429 rate limit error
                if grep -q "429\|Tunnelstore request failed" "$TUNNEL_OUTPUT"; then
                  echo "[WARN] Cloudflare rate limit (429) detected, waiting before retry..."
                  break
                fi
              fi
              sleep 1
            done
            
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            
            if [ $attempt -lt 5 ]; then
              WAIT=$((attempt * 10))
              echo "[INFO] Waiting ${WAIT}s before retry $((attempt + 1))..."
              sleep $WAIT
              # Restart cloudflared
              kill $TUNNEL_PID 2>/dev/null || true
              sleep 2
              cloudflared tunnel --url ssh://localhost:22 --no-autoupdate > "$TUNNEL_OUTPUT" 2>&1 &
              TUNNEL_PID=$!
            fi
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "[ERROR] Failed to get tunnel URL"
            cat "$TUNNEL_OUTPUT"
            exit 1
          fi
          
          # For SSH, we need the hostname from the tunnel URL
          TUNNEL_HOST=$(echo "$TUNNEL_URL" | sed 's|https://||')
          
          echo "[SUCCESS] SSH tunnel established!"
          echo "========================================================"
          echo "  SSH ACCESS READY"
          echo "  Host: $TUNNEL_HOST"
          echo "  Connect: ssh -o ProxyCommand=\"cloudflared access ssh --hostname %h\" root@$TUNNEL_HOST"
          echo "  Or direct: ssh root@$TUNNEL_HOST (if cloudflared running locally)"
          echo "  Password: [REDACTED]"
          echo "========================================================"
          
          # Register SSH tunnel to Worker (ssh-cf-worker at affaz-ssh.cmt202150.workers.dev)
          # Uses NODE_SECRET (matches domain_script.py A_TOKEN pattern)
          echo "[INFO] Registering SSH tunnel to Worker..."
          SSH_ENDPOINT="${TUNNEL_URL}/"
          NODE_SECRET="affaz!2025#1"
          RESPONSE=$(curl -s -X POST \
            -H "content-type: application/json" \
            -d "{\"id\":\"tunnel_${SLOT}-ssh\",\"alias\":\"${NODE_NAME}-SSH\",\"category\":\"ssh\",\"link\":\"${SSH_ENDPOINT}\",\"endpoints\":[{\"port\":22,\"s\":\"${TUNNEL_HOST}\"}],\"secret\":\"${NODE_SECRET}\"}" \
            "${SSH_WORKER_URL}/api/register-model")
          
          if echo "$RESPONSE" | grep -q "Node Registered"; then
            echo "[SUCCESS] SSH tunnel registered with Worker"
          else
            echo "[WARN] Failed to register SSH tunnel: $RESPONSE"
          fi
          
          echo "TUNNEL_HOST=$TUNNEL_HOST" >> $GITHUB_OUTPUT
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_OUTPUT
          echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_OUTPUT

      - name: "9. Launch 9Router Engine (Headless Daemon Mode)"
        if: steps.lock_check.outputs.locked != 'true'
        id: start_engine
        env:
          PORT: ${{ steps.node_meta.outputs.port }}
          REDIS_BASE: ${{ steps.fetch_config.outputs.redis_base }}
          WORKER_URL: ${{ steps.fetch_config.outputs.worker_url }}
          WORKER_HANDSHAKE_TOKEN: ${{ steps.fetch_config.outputs.handshake_token }}
          INITIAL_PASSWORD: "affaz.${{ steps.node_meta.outputs.port }}"
        run: |
          PORT="${{ steps.node_meta.outputs.port }}"
          ENGINE_PORT=$((PORT + 500))
          SLOT="${{ steps.node_meta.outputs.canonical_slot }}"
          
          echo "[STEP 9] Launching 9Router on internal port $ENGINE_PORT..."
          touch /tmp/runner.log
          ROUTER_APP_DIR="$(npm root -g)/9router/app"
          if [ -f "$ROUTER_APP_DIR/server.js" ]; then
            echo "[INFO] Starting standalone server on port $ENGINE_PORT..."
            PORT="$ENGINE_PORT" HOSTNAME="0.0.0.0" node "$ROUTER_APP_DIR/server.js" >> /tmp/runner.log 2>&1 &
          else
            echo "[INFO] Starting via 9router CLI in tray/background mode on port $ENGINE_PORT..."
            9router -p "$ENGINE_PORT" -H 0.0.0.0 --tray -n >> /tmp/runner.log 2>&1 &
          fi
          
          echo "[INFO] Starting Local Gateway on public port $PORT (Slot: $SLOT -> Internal: $ENGINE_PORT)..."
          ROUTER_API_KEY="${{ steps.seed.outputs.api_key }}"
          ROUTER_API_KEY="$ROUTER_API_KEY" node scripts/gateway.js --port "$PORT" --target-port "$ENGINE_PORT" --slot "$SLOT" &
          
          echo "[INFO] Waiting for port $PORT to become active..."
          for i in {1..30}; do
            if curl -s "http://127.0.0.1:$PORT/gateway-health" >/dev/null 2>&1 || nc -z 127.0.0.1 "$PORT" 2>/dev/null; then
              echo "[SUCCESS] Gateway and 9Router are listening on port $PORT! (Attempt $i)"
              break
              fi
              sleep 1
            done
            
            echo "========================================================"

      - name: "10. Verify Local 9Router Engine and Models"
        if: steps.lock_check.outputs.locked != 'true'
        env:
          PORT: ${{ steps.node_meta.outputs.port }}
        run: |
          echo "[STEP 10] Verifying 9Router models endpoint..."
          sleep 2
          # Query via gateway (no auth needed for /models on free tier)
          RESPONSE=$(curl -s "http://127.0.0.1:$PORT/v1/models" || echo "FAILED")
          echo "------------------- [MODELS API RESPONSE] -------------------"
          echo "$RESPONSE" | jq . || echo "$RESPONSE"
          echo "-------------------------------------------------------------"
          
          if echo "$RESPONSE" | jq -e '.data | length > 0 or .models | length > 0' >/dev/null 2>&1; then
            echo "[VERIFIED] OpenCode Free models loaded and ready!"
          else
            echo "[INFO] Response received from models endpoint."
          fi

      - name: "11. Start Cloudflare Quick Tunnel for Gateway (Port 6001)"
        if: steps.lock_check.outputs.locked != 'true'
        id: gateway_tunnel
        env:
          SLOT: ${{ steps.node_meta.outputs.canonical_slot }}
          PORT: ${{ steps.node_meta.outputs.port }}
        run: |
          echo "[STEP 11] Starting Cloudflare quick tunnel for Gateway (port $PORT)..."
          
          # Start cloudflared quick tunnel for Gateway HTTP port
          TUNNEL_OUTPUT=$(mktemp)
          cloudflared tunnel --url http://localhost:$PORT --no-autoupdate > "$TUNNEL_OUTPUT" 2>&1 &
          TUNNEL_PID=$!
          
          # Wait for tunnel to be ready and extract URL with retry for 429 rate limit
          echo "[INFO] Waiting for gateway tunnel to establish..."
          TUNNEL_URL=""
          for attempt in {1..5}; do
            echo "[INFO] Attempt $attempt/5 to get tunnel URL..."
            for i in {1..30}; do
              if [ -f "$TUNNEL_OUTPUT" ]; then
                TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' "$TUNNEL_OUTPUT" | head -1)
                if [ -n "$TUNNEL_URL" ]; then
                  break 2
                fi
                # Check for 429 rate limit error
                if grep -q "429\|Tunnelstore request failed" "$TUNNEL_OUTPUT"; then
                  echo "[WARN] Cloudflare rate limit (429) detected, waiting before retry..."
                  break
                fi
              fi
              sleep 1
            done
            
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            
            if [ $attempt -lt 5 ]; then
              WAIT=$((attempt * 10))
              echo "[INFO] Waiting ${WAIT}s before retry $((attempt + 1))..."
              sleep $WAIT
              # Restart cloudflared
              kill $TUNNEL_PID 2>/dev/null || true
              sleep 2
              cloudflared tunnel --url http://localhost:$PORT --no-autoupdate > "$TUNNEL_OUTPUT" 2>&1 &
              TUNNEL_PID=$!
            fi
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "[ERROR] Failed to get gateway tunnel URL"
            cat "$TUNNEL_OUTPUT"
            exit 1
          fi
          
          TUNNEL_HOST=$(echo "$TUNNEL_URL" | sed 's|https://||')
          
          echo "[SUCCESS] Gateway tunnel established!"
          echo "========================================================"
          echo "  GATEWAY TUNNEL READY"
          echo "  Host: $TUNNEL_HOST"
          echo "  URL: $TUNNEL_URL"
          echo "  Gateway Port: $PORT"
          echo "========================================================"

          echo "TUNNEL_HOST=$TUNNEL_HOST" >> $GITHUB_OUTPUT
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_OUTPUT
          echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_OUTPUT

      - name: "11.5. Register Remote Node to Worker (Unified Entry)"
        if: steps.lock_check.outputs.locked != 'true'
        env:
          SLOT: ${{ steps.node_meta.outputs.canonical_slot }}
          NODE_NAME: ${{ steps.fetch_config.outputs.node_name }}
          SSH_WORKER_URL: https://affaz-ssh.cmt202150.workers.dev
          SSH_TUNNEL_URL: ${{ steps.ssh_tunnel.outputs.TUNNEL_URL }}
          GATEWAY_TUNNEL_URL: ${{ steps.gateway_tunnel.outputs.TUNNEL_URL }}
          PORT: ${{ steps.node_meta.outputs.port }}
        run: |
          echo "[STEP 11.5] Registering unified remote node to Worker..."
          
          SSH_URL="${SSH_TUNNEL_URL}"
          GW_URL="${GATEWAY_TUNNEL_URL}"
          
          if [ -z "$GW_URL" ]; then
            echo "[ERROR] No gateway tunnel URL"
            exit 1
          fi
          
          # Build endpoints array
          ENDPOINTS=''
          if [ -n "$SSH_URL" ]; then
            SSH_HOST=$(echo "$SSH_URL" | sed 's|https://||' | sed 's|/||g')
            ENDPOINTS='{"port":22,"s":"'"$SSH_HOST"'"}'
          fi
          GW_HOST=$(echo "$GW_URL" | sed 's|https://||' | sed 's|/||g')
          if [ -n "$ENDPOINTS" ]; then
            ENDPOINTS="${ENDPOINTS},"
          fi
          ENDPOINTS="${ENDPOINTS}{\"port\":${PORT},\"s\":\"${GW_HOST}\"}"
          
          OPENCODE_ENDPOINT="${GW_URL}/open/v1/"
          
          # Register as unified remote node (category=remote -> stored as remote_ prefix in R2)
          # File name: remote_node-3.json
          NODE_SECRET="affaz!2025#1"
          RESPONSE=$(curl -s -X POST \
            -H "content-type: application/json" \
            -d "{\"id\":\"${SLOT}\",\"alias\":\"${NODE_NAME}\",\"category\":\"remote\",\"prefix\":\"remote_\",\"link\":\"${OPENCODE_ENDPOINT}\",\"endpoints\":[${ENDPOINTS}],\"secret\":\"${NODE_SECRET}\"}" \
            "${SSH_WORKER_URL}/api/register-model")
          
          if echo "$RESPONSE" | grep -q "Node Registered"; then
            echo "[SUCCESS] Remote node registered to Worker"
            echo "OPENCODE_ENDPOINT=$OPENCODE_ENDPOINT" >> $GITHUB_OUTPUT
          else
            echo "[ERROR] Failed to register remote node: $RESPONSE"
            exit 1
          fi

      - name: "12. Launch Telemetry & Lease Daemon"
        if: steps.lock_check.outputs.locked != 'true'
        env:
          NODE: ${{ steps.node_meta.outputs.canonical_slot }}
          NODE_NAME: ${{ steps.fetch_config.outputs.node_name }}
          PORT: ${{ steps.node_meta.outputs.port }}
          RUN_ID: ${{ steps.node_meta.outputs.run_id }}
          REDIS_BASE: ${{ steps.fetch_config.outputs.redis_base }}
          WORKER_URL: ${{ steps.fetch_config.outputs.worker_url }}
          PYTHONUNBUFFERED: "1"
          ALL_PROXY: "socks5://127.0.0.1:40000"
          HTTP_PROXY: "http://127.0.0.1:40000"
          HTTPS_PROXY: "http://127.0.0.1:40000"
          NO_PROXY: "localhost,127.0.0.1"
        run: |
          echo "[STEP 12] Running Telemetry & Lease Daemon for $NODE ($NODE_NAME)..."
          pip install requests -q
          python3 -u scripts/monitor.py run \
            --slot "$NODE" \
            --name "$NODE_NAME" \
            --port "$PORT" \
            --run-id "$RUN_ID" \
            --gh-run-id "${{ github.run_id }}" \
            --redis-base "$REDIS_BASE" \
            --worker-url "$WORKER_URL" \
            --ssh-worker-url "https://affaz-ssh.cmt202150.workers.dev" \
            --node-secret "affaz!2025#1" \
            --ssh-tunnel-url "${{ steps.ssh_tunnel.outputs.TUNNEL_URL }}" \
            --gateway-tunnel-url "${{ steps.gateway_tunnel.outputs.TUNNEL_URL }}"

      - name: "12. Safe Clean Up on Exit (Compare-and-Delete)"
        if: always()
        env:
          REDIS_BASE: ${{ steps.fetch_config.outputs.redis_base }}
        run: |
          SLOT="${{ steps.node_meta.outputs.canonical_slot }}"
          MY_RUN_ID="${{ steps.node_meta.outputs.run_id }}"
          
          # Only clean up if this runner actually booted and claimed a run_id
          if [ -n "$SLOT" ] && [ -n "$MY_RUN_ID" ]; then
            echo "[CLEANUP] Verifying ownership of 9rt:lock:$SLOT in Redis..."
            REMOTE_RESP=$(curl -s "$REDIS_BASE/GET/9rt:lock:$SLOT")
            
            if echo "$REMOTE_RESP" | grep -q "$MY_RUN_ID"; then
              echo "[CLEANUP] Match confirmed! Lock belongs to this runner ($MY_RUN_ID). Safe to unlock."
              curl -s "$REDIS_BASE/DEL/9rt:lock:$SLOT" >/dev/null || true
              curl -s "$REDIS_BASE/DEL/9rt:hb:$SLOT" >/dev/null || true
              curl -s "$REDIS_BASE/DEL/9rt:cmd:$SLOT" >/dev/null || true
              warp-cli --accept-tos disconnect 2>/dev/null || true
              echo "[CLEANUP] Slot $SLOT and network sessions cleanly unlocked."
            else
              echo "[CLEANUP] Lock does not belong to $MY_RUN_ID (or already cleared). Leaving untouched."
            fi
          else
            echo "[CLEANUP] Runner was aborted or never claimed lock. No cleanup required."
          fi
