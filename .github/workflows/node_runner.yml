name: "9Router Dedicated Node Runner"

on:
  workflow_dispatch:
    inputs:
      nodes:
        description: "Target Nodes"
        required: true
        type: string

jobs:
  resolve-nodes:
    name: "Resolve Target Nodes"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: "Compute Matrix from Nodes Input"
        id: resolve
        run: |
          INPUT="${{ github.event.inputs.nodes }}"
          echo "[INFO] Target nodes input: $INPUT"
          
          # Parse comma-separated nodes into JSON array
          NODES_JSON=$(node -e "
            const raw = process.argv[1] || '';
            const arr = raw.split(',').map(s => s.trim()).filter(Boolean);
            if (!arr.length) {
              console.error('[ERROR] No nodes provided!');
              process.exit(1);
            }
            console.log(JSON.stringify(arr));
          " "$INPUT")
          
          echo "matrix=$NODES_JSON" >> $GITHUB_OUTPUT
          echo "=================================================="
          echo "  RESOLVED TARGET NODES: $NODES_JSON"
          echo "=================================================="

  run-node:
    name: "Node: ${{ matrix.node_id }}"
    needs: resolve-nodes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_id: ${{ fromJson(needs.resolve-nodes.outputs.matrix) }}

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4

      - name: "2. Set Up Node.js and System Tools"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "3. Resolve Dynamic Port (Formula: 6000 + N) and Identity"
        id: node_meta
        run: |
          NODE="${{ matrix.node_id }}"
          
          # Extract number from the node identifier (e.g. 9rt1 -> 1, 9rt3 -> 3, 9rt320 -> 320)
          NUM=$(echo "$NODE" | grep -o -E '[0-9]+' | tail -n 1)
          
          if [ -n "$NUM" ]; then
            PORT=$((6000 + NUM))
          else
            PORT=20128
          fi
          
          # Validate port limit
          if [ "$PORT" -gt 65535 ]; then
            echo "[ERROR] Calculated port $PORT exceeds maximum allowed TCP port 65535!"
            exit 1
          fi
          
          SUBDOMAIN="https://${NODE}.affaz101.eu.cc"
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "subdomain=$SUBDOMAIN" >> $GITHUB_OUTPUT
          
          # Standard API key for 9router
          API_KEY="sk-361ddf48ad95487f-l1vj9z-499b11a6"
          echo "api_key=$API_KEY" >> $GITHUB_OUTPUT
          
          echo "=================================================="
          echo "  NODE IDENTITY : $NODE"
          echo "  DYNAMIC PORT  : $PORT (Formula: 6000 + $NUM)"
          echo "  SUBDOMAIN     : $SUBDOMAIN"
          echo "=================================================="

      - name: "4. Install 9Router CLI"
        run: |
          echo "[STEP 4] Installing 9Router globally via npm..."
          npm install -g 9router
          echo "[INFO] 9Router root: $(npm root -g)/9router"

      - name: "5. Headlessly Pre-Seed Database (OpenCode Models and API Key)"
        env:
          ROUTER_API_KEY: ${{ steps.node_meta.outputs.api_key }}
        run: |
          echo "[STEP 5] Running SQLite Seeder..."
          python3 scripts/seed_db.py
          
          DB_PATH="$HOME/.9router/db/data.sqlite"
          if [ -f "$DB_PATH" ]; then
            echo "[SUCCESS] Database initialized at $DB_PATH"
            ls -lh "$DB_PATH"
          else
            echo "[ERROR] Database file not found!"
            exit 1
          fi

      - name: "6. Launch 9Router Engine (Headless Daemon Mode)"
        id: start_engine
        env:
          PORT: ${{ steps.node_meta.outputs.port }}
        run: |
          echo "[STEP 6] Launching 9Router server on dynamic port $PORT..."
          
          # Locate standalone server.js
          ROUTER_APP_DIR="$(npm root -g)/9router/app"
          
          if [ -f "$ROUTER_APP_DIR/server.js" ]; then
            echo "[INFO] Starting standalone server from $ROUTER_APP_DIR/server.js..."
            PORT="$PORT" HOSTNAME="0.0.0.0" node "$ROUTER_APP_DIR/server.js" &
          else
            echo "[INFO] Starting via 9router CLI in tray/background mode..."
            9router -p "$PORT" -H 0.0.0.0 --tray -n &
          fi
          
          echo "[INFO] Waiting for port $PORT to become active..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 "$PORT" 2>/dev/null || curl -s "http://127.0.0.1:$PORT" >/dev/null 2>&1; then
              echo "[SUCCESS] 9Router is listening on port $PORT! (Attempt $i)"
              break
            fi
            sleep 1
          done

      - name: "7. Verify Local 9Router Engine and Models"
        env:
          PORT: ${{ steps.node_meta.outputs.port }}
          API_KEY: ${{ steps.node_meta.outputs.api_key }}
        run: |
          echo "[STEP 7] Verifying 9Router models endpoint with Bearer Token..."
          sleep 2
          RESPONSE=$(curl -s -H "Authorization: Bearer $API_KEY" "http://127.0.0.1:$PORT/v1/models" || echo "FAILED")
          echo "------------------- [MODELS API RESPONSE] -------------------"
          echo "$RESPONSE" | jq . || echo "$RESPONSE"
          echo "-------------------------------------------------------------"
          
          if echo "$RESPONSE" | grep -q "mimo-v2.5-free"; then
            echo "[VERIFIED] OpenCode Free models loaded and ready!"
          else
            echo "[INFO] Verified response received from models endpoint."
          fi

      - name: "8. Install and Connect Cloudflare Tunnel"
        env:
          NODE: ${{ matrix.node_id }}
          CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          echo "[STEP 8] Setting up Cloudflare Tunnel for $NODE..."
          
          # Add Cloudflare GPG key and repo
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-public-v2.gpg | sudo tee /usr/share/keyrings/cloudflare-public-v2.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-public-v2.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflared
          
          if [ -z "$CF_TOKEN" ]; then
            echo "[WARN] Secret CF_TUNNEL_TOKEN is not set in repository secrets!"
            echo "[INFO] Running in mock/dry-run mode for tunnel."
          else
            echo "[INFO] Starting cloudflared tunnel service..."
            cloudflared tunnel --no-autoupdate run --token "$CF_TOKEN" &
            echo "[SUCCESS] Cloudflare tunnel started in background."
          fi

      - name: "9. Register in Redis and Begin Telemetry Heartbeat Loop"
        env:
          NODE: ${{ matrix.node_id }}
          PORT: ${{ steps.node_meta.outputs.port }}
          SUBDOMAIN: ${{ steps.node_meta.outputs.subdomain }}
          API_KEY: ${{ steps.node_meta.outputs.api_key }}
          REDIS_BASE: "https://jelab101-rimjhim.hf.space"
        run: |
          echo "[STEP 9] Registering node $NODE in Redis at $REDIS_BASE..."
          
          # Initial Registration
          curl -s "$REDIS_BASE/SET/9rt:node:${NODE}:status/online" >/dev/null || true
          curl -s "$REDIS_BASE/SET/9rt:node:${NODE}:port/${PORT}" >/dev/null || true
          curl -s "$REDIS_BASE/SET/9rt:node:${NODE}:subdomain/https:%2F%2F${NODE}.affaz101.eu.cc" >/dev/null || true
          curl -s "$REDIS_BASE/SET/9rt:node:${NODE}:last_boot/$(date +%s)" >/dev/null || true
          
          echo "================================================================"
          echo "  NODE $NODE IS FULLY OPERATIONAL AND SERVING TRAFFIC!"
          echo "  Subdomain : $SUBDOMAIN"
          echo "  Port      : $PORT (Dynamic)"
          echo "================================================================"
          
          # Realtime Heartbeat Loop
          HEARTBEAT_COUNT=0
          while true; do
            CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S')
            TIMESTAMP=$(date +%s)
            
            # Send heartbeat to Redis
            curl -s "$REDIS_BASE/SET/9rt:node:${NODE}:heartbeat/${TIMESTAMP}" >/dev/null || true
            curl -s "$REDIS_BASE/SET/9rt:node:${NODE}:status/online" >/dev/null || true
            
            HEARTBEAT_COUNT=$((HEARTBEAT_COUNT + 1))
            
            # Health check 9Router process with Bearer auth
            if curl -s -H "Authorization: Bearer $API_KEY" "http://127.0.0.1:$PORT/v1/models" >/dev/null 2>&1; then
              STATUS_FLAG="HEALTHY 🟢"
            else
              STATUS_FLAG="PORT UNRESPONSIVE 🔴"
            fi
            
            echo "[$CURRENT_TIME] [$NODE] Heartbeat #$HEARTBEAT_COUNT | Port: $PORT | Status: $STATUS_FLAG | Tunnel: Active"
            
            # Sleep 15 seconds between heartbeats
            sleep 15
          done

      - name: "10. Clean Up on Exit"
        if: always()
        env:
          NODE: ${{ matrix.node_id }}
          REDIS_BASE: "https://jelab101-rimjhim.hf.space"
        run: |
          echo "[CLEANUP] Setting $NODE status to offline in Redis..."
          curl -s "$REDIS_BASE/SET/9rt:node:${NODE}:status/offline" >/dev/null || true
          echo "[CLEANUP] Done."
