name: "9Router Dedicated Node Runner"

on:
  workflow_dispatch:
    inputs:
      nodes:
        description: "Target Nodes (e.g. node-1, node-2)"
        required: true
        type: string
      node_name:
        description: "Poetic Node Name (e.g. Sobuj Kanon)"
        required: false
        type: string
        default: ""
      force:
        description: "Force Takeover (Bypass Lock)"
        required: false
        type: boolean
        default: false

jobs:
  resolve-nodes:
    name: "Resolve Target Nodes"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: "Compute Matrix from Nodes Input"
        id: resolve
        run: |
          INPUT="${{ github.event.inputs.nodes }}"
          echo "[INFO] Target nodes input: $INPUT"
          
          # Parse comma-separated nodes into JSON array
          NODES_JSON=$(node -e "
            const raw = process.argv[1] || '';
            const arr = raw.split(',').map(s => s.trim()).filter(Boolean);
            if (!arr.length) {
              console.error('[ERROR] No nodes provided!');
              process.exit(1);
            }
            console.log(JSON.stringify(arr));
          " "$INPUT")
          
          echo "matrix=$NODES_JSON" >> $GITHUB_OUTPUT
          echo "=================================================="
          echo "  RESOLVED TARGET NODES: $NODES_JSON"
          echo "=================================================="

  run-node:
    name: "Node: ${{ matrix.node_id }}"
    needs: resolve-nodes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_id: ${{ fromJson(needs.resolve-nodes.outputs.matrix) }}

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4

      - name: "2. Set Up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "3. Set Up Node.js and System Tools"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "4. Resolve Dynamic Port (Formula: 6000 + N) and Identity"
        id: node_meta
        run: |
          NODE="${{ matrix.node_id }}"
          
          # Extract trailing digits (e.g. node-3 -> 3, 9rt2 -> 2, 3 -> 3)
          NUM=$(echo "$NODE" | grep -o -E '[0-9]+' | tail -n 1)
          
          if [ -n "$NUM" ]; then
            PORT=$((6000 + NUM))
            CANONICAL_SLOT="node-$NUM"
          else
            PORT=20128
            CANONICAL_SLOT="$NODE"
          fi
          
          # Validate TCP port limit
          if [ "$PORT" -gt 65535 ]; then
            echo "[ERROR] Calculated port $PORT exceeds maximum allowed TCP port 65535!"
            exit 1
          fi
          
          BOOT_TIME=$(date +%s)
          RUN_ID="${CANONICAL_SLOT}_${BOOT_TIME}"
          
          NODE_NAME="${{ github.event.inputs.node_name }}"
          if [ -z "$NODE_NAME" ]; then
            NODE_NAME="$CANONICAL_SLOT"
          fi
          
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "canonical_slot=$CANONICAL_SLOT" >> $GITHUB_OUTPUT
          echo "node_name=$NODE_NAME" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: "5. Fetch Runner Config from Worker (Single Source of Truth)"
        id: fetch_config
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_HANDSHAKE_TOKEN: ${{ secrets.WORKER_HANDSHAKE_TOKEN }}
          SLOT: ${{ steps.node_meta.outputs.canonical_slot }}
          RUN_ID: ${{ steps.node_meta.outputs.run_id }}
        run: |
          echo "[STEP 5] Fetching runner config from Worker..."
          RESPONSE=$(curl -s -X POST \
            -H "x-handshake-token: $WORKER_HANDSHAKE_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"run_id": "'$RUN_ID'"}' \
            "$WORKER_URL/api/node/$SLOT/tunnel-claim")
          
          echo "Worker Response: $RESPONSE"
          
          TOKEN=$(echo "$RESPONSE" | jq -r '.token // empty')
          REDIS_BASE=$(echo "$RESPONSE" | jq -r '.config.redis_base // empty')
          ADMIN_SECRET=$(echo "$RESPONSE" | jq -r '.config.admin_secret // empty')
          WORKER_URL_RECEIVED=$(echo "$RESPONSE" | jq -r '.config.worker_url // empty')
          HANDSHAKE_TOKEN_RECEIVED=$(echo "$RESPONSE" | jq -r '.config.handshake_token // empty')
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "[ERROR] Failed to get tunnel token from Worker"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          
          if [ -z "$REDIS_BASE" ] || [ "$REDIS_BASE" = "null" ]; then
            echo "[ERROR] REDIS_BASE not returned by Worker"
            exit 1
          fi
          
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "redis_base=$REDIS_BASE" >> $GITHUB_OUTPUT
          echo "admin_secret=$ADMIN_SECRET" >> $GITHUB_OUTPUT
          echo "worker_url=$WORKER_URL_RECEIVED" >> $GITHUB_OUTPUT
          echo "handshake_token=$HANDSHAKE_TOKEN_RECEIVED" >> $GITHUB_OUTPUT
          
          echo "[SUCCESS] Config fetched from Worker:"
          echo "  - Tunnel Token: ${TOKEN:0:20}..."
          echo "  - Redis Base: $REDIS_BASE"
          echo "  - Worker URL: $WORKER_URL_RECEIVED"

      - name: "6. Pre-Flight Lock Check (Fast Abort) - Using Worker's Redis"
        id: lock_check
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
            echo "[INFO] Force override enabled! Bypassing lock check."
          fi
          
          echo "[STEP 6] Pre-flight checking lock for slot ${{ steps.node_meta.outputs.canonical_slot }} using Worker's Redis..."
          if python3 scripts/monitor.py check-lock --slot "${{ steps.node_meta.outputs.canonical_slot }}" --redis-base "${{ steps.fetch_config.outputs.redis_base }}" $FORCE_FLAG; then
            echo "locked=false" >> $GITHUB_OUTPUT
          else
            echo "locked=true" >> $GITHUB_OUTPUT
            echo "=================================================="
            echo "  [ABORT] Active lock detected for ${{ steps.node_meta.outputs.canonical_slot }}."
            echo "  Duplicate run terminated cleanly without changes."
            echo "=================================================="
          fi

      - name: "7. Install 9Router CLI"
        if: steps.lock_check.outputs.locked != 'true'
        run: |
          echo "[STEP 6] Installing 9Router globally via npm..."
          npm install -g 9router
          echo "[INFO] 9Router root: $(npm root -g)/9router"

      - name: "8. Headlessly Pre-Seed Database (OpenCode Models)"
        if: steps.lock_check.outputs.locked != 'true'
        env:
          PORT: ${{ steps.node_meta.outputs.port }}
          REDIS_BASE: ${{ steps.fetch_config.outputs.redis_base }}
          INITIAL_PASSWORD: "affaz26.${{ steps.node_meta.outputs.port }}"
        run: |
          echo "[STEP 8] Running SQLite Seeder..."
          python3 scripts/seed_db.py
          
          DB_PATH="$HOME/.9router/db/data.sqlite"
          if [ -f "$DB_PATH" ]; then
            echo "[SUCCESS] Database initialized at $DB_PATH"
            ls -lh "$DB_PATH"
          else
            echo "[ERROR] Database file not found!"
            exit 1
          fi

      - name: "7.5. Setup Cloudflare WARP (Local SOCKS5 Proxy Mode on 127.0.0.1:40000)"
        if: steps.lock_check.outputs.locked != 'true'
        run: |
          echo "[STEP 7.5] Installing Cloudflare WARP client..."
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp

          echo "[INFO] Ensuring warp-svc daemon is active..."
          sudo systemctl start warp-svc 2>/dev/null || sudo service warp-svc start 2>/dev/null || true
          sleep 2

          echo "[INFO] Registering WARP client..."
          warp-cli --accept-tos registration new 2>/dev/null || warp-cli --accept-tos register 2>/dev/null || true

          echo "[INFO] Configuring WARP in SOCKS5 Proxy mode (preventing routing conflicts with cloudflared)..."
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000 2>/dev/null || true

          echo "[INFO] Connecting to Cloudflare WARP edge..."
          warp-cli --accept-tos connect

          # Short wait for tunnel establishment
          for i in {1..10}; do
            STATUS=$(warp-cli --accept-tos status 2>/dev/null || echo "")
            if echo "$STATUS" | grep -qi "Connected"; then
              echo "[SUCCESS] Cloudflare WARP is connected in proxy mode! (Attempt $i)"
              break
            fi
            sleep 1
          done

          echo "[INFO] Testing WARP SOCKS5 egress IP..."
          curl -s --socks5 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|warp=' || echo "[WARN] Trace check skipped."

      - name: "9. Launch 9Router Engine (Headless Daemon Mode)"
        if: steps.lock_check.outputs.locked != 'true'
        id: start_engine
        env:
          PORT: ${{ steps.node_meta.outputs.port }}
          REDIS_BASE: ${{ steps.fetch_config.outputs.redis_base }}
          WORKER_URL: ${{ steps.fetch_config.outputs.worker_url }}
          WORKER_HANDSHAKE_TOKEN: ${{ steps.fetch_config.outputs.handshake_token }}
          INITIAL_PASSWORD: "affaz26.${{ steps.node_meta.outputs.port }}"
          ALL_PROXY: "socks5://127.0.0.1:40000"
          HTTP_PROXY: "http://127.0.0.1:40000"
          HTTPS_PROXY: "http://127.0.0.1:40000"
          NO_PROXY: "localhost,127.0.0.1"
        run: |
          PORT="${{ steps.node_meta.outputs.port }}"
          ENGINE_PORT=$((PORT + 500))
          SLOT="${{ steps.node_meta.outputs.canonical_slot }}"
          
          echo "[STEP 9] Launching 9Router on internal port $ENGINE_PORT..."
          touch /tmp/runner.log
          ROUTER_APP_DIR="$(npm root -g)/9router/app"
          if [ -f "$ROUTER_APP_DIR/server.js" ]; then
            echo "[INFO] Starting standalone server on port $ENGINE_PORT..."
            PORT="$ENGINE_PORT" HOSTNAME="0.0.0.0" node "$ROUTER_APP_DIR/server.js" >> /tmp/runner.log 2>&1 &
          else
            echo "[INFO] Starting via 9router CLI in tray/background mode on port $ENGINE_PORT..."
            9router -p "$ENGINE_PORT" -H 0.0.0.0 --tray -n >> /tmp/runner.log 2>&1 &
          fi
          
          echo "[INFO] Starting Local Gateway on public port $PORT (Slot: $SLOT -> Internal: $ENGINE_PORT)..."
          node scripts/gateway.js --port "$PORT" --target-port "$ENGINE_PORT" --slot "$SLOT" &
          
          echo "[INFO] Waiting for port $PORT to become active..."
          for i in {1..30}; do
            if curl -s "http://127.0.0.1:$PORT/gateway-health" >/dev/null 2>&1 || nc -z 127.0.0.1 "$PORT" 2>/dev/null; then
              echo "[SUCCESS] Gateway and 9Router are listening on port $PORT! (Attempt $i)"
              break
            fi
            sleep 1
          done

      - name: "10. Verify Local 9Router Engine and Models"
        if: steps.lock_check.outputs.locked != 'true'
        env:
          PORT: ${{ steps.node_meta.outputs.port }}
        run: |
          echo "[STEP 10] Verifying 9Router models endpoint..."
          sleep 2
          # Query via gateway (no auth needed for /models on free tier)
          RESPONSE=$(curl -s "http://127.0.0.1:$PORT/v1/models" || echo "FAILED")
          echo "------------------- [MODELS API RESPONSE] -------------------"
          echo "$RESPONSE" | jq . || echo "$RESPONSE"
          echo "-------------------------------------------------------------"
          
          if echo "$RESPONSE" | jq -e '.data | length > 0 or .models | length > 0' >/dev/null 2>&1; then
            echo "[VERIFIED] OpenCode Free models loaded and ready!"
          else
            echo "[INFO] Response received from models endpoint."
          fi

      - name: "10. Install Cloudflare Tunnel Client (cloudflared)"
        if: steps.lock_check.outputs.locked != 'true'
        run: |
          echo "[STEP 10] Installing Cloudflare Tunnel daemon (cloudflared)..."
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-public-v2.gpg | sudo tee /usr/share/keyrings/cloudflare-public-v2.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-public-v2.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflared
          echo "[SUCCESS] cloudflared $(cloudflared --version) installed and ready for authenticated handshake."

      - name: "11. Launch Telemetry, Authenticated Tunnel Handshake & Lease Daemon"
        if: steps.lock_check.outputs.locked != 'true'
        env:
          NODE: ${{ steps.node_meta.outputs.canonical_slot }}
          NODE_NAME: ${{ steps.node_meta.outputs.node_name }}
          PORT: ${{ steps.node_meta.outputs.port }}
          RUN_ID: ${{ steps.node_meta.outputs.run_id }}
          REDIS_BASE: ${{ steps.fetch_config.outputs.redis_base }}
          WORKER_URL: ${{ steps.fetch_config.outputs.worker_url }}
          WORKER_HANDSHAKE_TOKEN: ${{ steps.fetch_config.outputs.handshake_token }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "[STEP 11] Running 2-Key Telemetry & Lease Daemon for $NODE ($NODE_NAME)..."
          python3 -u scripts/monitor.py run \
            --slot "$NODE" \
            --name "$NODE_NAME" \
            --port "$PORT" \
            --run-id "$RUN_ID" \
            --gh-run-id "${{ github.run_id }}" \
            --redis-base "$REDIS_BASE" \
            --worker-url "$WORKER_URL" \
            --handshake-token "$WORKER_HANDSHAKE_TOKEN"

      - name: "12. Safe Clean Up on Exit (Compare-and-Delete)"
        if: always()
        env:
          REDIS_BASE: ${{ steps.fetch_config.outputs.redis_base }}
        run: |
          SLOT="${{ steps.node_meta.outputs.canonical_slot }}"
          MY_RUN_ID="${{ steps.node_meta.outputs.run_id }}"
          
          # Only clean up if this runner actually booted and claimed a run_id
          if [ -n "$SLOT" ] && [ -n "$MY_RUN_ID" ]; then
            echo "[CLEANUP] Verifying ownership of 9rt:lock:$SLOT in Redis..."
            REMOTE_RESP=$(curl -s "$REDIS_BASE/GET/9rt:lock:$SLOT")
            
            if echo "$REMOTE_RESP" | grep -q "$MY_RUN_ID"; then
              echo "[CLEANUP] Match confirmed! Lock belongs to this runner ($MY_RUN_ID). Safe to unlock."
              curl -s "$REDIS_BASE/DEL/9rt:lock:$SLOT" >/dev/null || true
              curl -s "$REDIS_BASE/DEL/9rt:hb:$SLOT" >/dev/null || true
              curl -s "$REDIS_BASE/DEL/9rt:cmd:$SLOT" >/dev/null || true
              warp-cli --accept-tos disconnect 2>/dev/null || true
              echo "[CLEANUP] Slot $SLOT and network sessions cleanly unlocked."
            else
              echo "[CLEANUP] Lock does not belong to $MY_RUN_ID (or already cleared). Leaving untouched."
            fi
          else
            echo "[CLEANUP] Runner was aborted or never claimed lock. No cleanup required."
          fi
